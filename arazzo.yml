arazzo: 1.0.1
info:
  title: Payments workflows (API Commons)
  version: 0.1.0-draft.20261111
  summary: Reference workflows over the common Payments operations.
  description: 'Reference compositions of the operations this context''s providers share. Not measured: every step
    is a core- or extended-tier operation of the common OpenAPI, so the workflow runs against any provider that
    implements those operations (see crosswalk/).'
sourceDescriptions:
- name: payments
  url: ./openapi.yml
  type: openapi
workflows:
- workflowId: take-and-refund-a-payment
  summary: Create a customer, take a payment, and refund it
  description: Create a customer, take a payment, and refund it.
  steps:
  - stepId: customer
    operationId: createCustomer
    description: Create a customer -- a core-tier operation (78% of providers).
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      id: $response.body#/id
  - stepId: payment
    operationId: createPayment
    description: Create a payment -- a core-tier operation (72% of providers).
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      id: $response.body#/id
    requestBody:
      contentType: application/json
      payload:
        customer_id: $steps.customer.outputs.id
  - stepId: refund
    operationId: createRefund
    description: Create a refund -- a core-tier operation (89% of providers).
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      id: $response.body#/id
    requestBody:
      contentType: application/json
      payload:
        payment_id: $steps.payment.outputs.id
  x-commons-tiers:
  - core
